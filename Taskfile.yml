version: '3'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
    internal: true
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
    internal: true
  e2e:
    taskfile: ./e2e/Taskfile.yml
    dir: ./e2e
    internal: true
  gpu-service:
    taskfile: ./gpu-service/Taskfile.yml
    dir: ./gpu-service
    internal: true

tasks:
  setup:
    desc: Set up both backend and frontend
    cmds:
      - task: backend:setup
      - task: frontend:setup
      - task: e2e:setup

  build:
    desc: Build both backend and frontend
    cmds:
      - task: backend:build
      - task: frontend:build

  test:
    desc: Run all tests for both backend and frontend
    cmds:
      - task: backend:test
      - task: frontend:test

  precommit:
    desc: Run pre-commit checks for both backend and frontend
    cmds:
      - task: backend:precommit
      - task: frontend:precommit
      - task: gpu-service:precommit

  help:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  format:
    desc: Auto-format code
    cmds:
      - task: frontend:format
      - task: e2e:format

  default:
    desc: Show help by default
    cmds:
      - task help
    silent: true

  e2e:
    desc: Run end-to-end tests
    cmds:
      - task: e2e:test

  start:
    desc: Start both backend and frontend in development mode
    deps:
      - task: backend:run-dev
      - task: frontend:dev

  start-services:
    desc: Start required services (e.g., Jaeger, PostgreSQL)
    cmds:
      - docker compose -f ./backend/development/docker-compose.yml up --remove-orphans -d

  claude:
    desc: Run Claude Code in YOLO mode inside an isolated dev container
    cmds:
      - docker build -t homehub-claude-dev docker/claude-dev/
      - |
        docker run -it --rm \
          --network host \
          --group-add $(stat -c '%g' /var/run/docker.sock) \
          -v "{{.ROOT_DIR}}:/workspace" \
          -v "$HOME/.claude:/home/claude/.claude" \
          -v "$HOME/.claude.json:/home/claude/.claude.json" \
          -v "/var/run/docker.sock:/var/run/docker.sock" \
          -w /workspace \
          homehub-claude-dev \
          claude --dangerously-skip-permissions